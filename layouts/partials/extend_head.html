<script>
    (function () {
        // 图片立即加载: Hugo 默认 loading=lazy, 专利附图是内容核心,
        // 懒加载导致手机快速翻页时图片空白/未定位(用户反馈"显示不全/不居中")。
        // 全部改为 eager, 打开页面即全部加载。
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('.post-content img').forEach(function (im) {
                    im.loading = 'eager';
                });
            });
        } else {
            document.querySelectorAll('.post-content img').forEach(function (im) {
                im.loading = 'eager';
            });
        }
        // 自动刷新检测: GitHub Pages CDN 缓存 HTML 10 分钟, 部署后刷新可能
        // 拿到旧版。用构建时间戳做版本号, localStorage 比对, 版本变了自动 reload。
        // ⚠️ 必须限制为「每会话最多 reload 一次」: CDN 缓存抖动时 reload 后
        // 版本号可能又不同, 不限制会无限 reload 转圈(2026-08-10 实测踩坑)。
        var VER_KEY = 'site-ver';
        var RELOAD_KEY = 'site-reloaded-now';
        var THIS_VER = {{ now.Unix }};
        try {
            var old = localStorage.getItem(VER_KEY);
            var reloaded = sessionStorage.getItem(RELOAD_KEY);
            if (old && old !== String(THIS_VER) && !reloaded) {
                localStorage.setItem(VER_KEY, String(THIS_VER));
                sessionStorage.setItem(RELOAD_KEY, '1');
                location.reload();
            } else if (!old) {
                localStorage.setItem(VER_KEY, String(THIS_VER));
            }
        } catch (e) {}

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
            // PaperMod theme colors: light = white (home bg), dark = rgb(29,30,32)
            function syncThemeColor() {
                var theme = document.documentElement.dataset.theme;
                meta.content = (theme === 'dark') ? '#1d1e20' : '#ffffff';
            }
            syncThemeColor();
            // keep in sync when user toggles theme (data-theme attr changes)
            if (window.MutationObserver) {
                new MutationObserver(syncThemeColor).observe(
                    document.documentElement,
                    { attributes: true, attributeFilter: ['data-theme'] }
                );
            }
        }
        // Hard guarantee: in light mode the code block must render as a SINGLE
        // rounded outer frame. Inline styles beat any stylesheet (incl. stale
        // cached CSS): zero inner borders AND inner background (inner pre has
        // no border-radius; its bg would poke square corners out of the arc).
        function fixCodeBorders() {
            if (document.documentElement.dataset.theme === 'dark') return;
            var blocks = document.querySelectorAll('.highlight');
            for (var i = 0; i < blocks.length; i++) {
                var h = blocks[i];
                h.style.border = '1px solid var(--border)';
                h.style.borderRadius = 'var(--radius)';
                var inners = h.querySelectorAll('pre, code, .chroma');
                for (var j = 0; j < inners.length; j++) {
                    inners[j].style.border = 'none';
                    inners[j].style.outline = 'none';
                    inners[j].style.boxShadow = 'none';
                    inners[j].style.background = 'transparent';
                    inners[j].style.borderRadius = 'var(--radius)';
                }
            }
            // Bare <pre class="chroma"> (no .highlight wrapper): PaperMod's
            // chroma theme is DARK, so in light mode give it a light card.
            // NOTE: query all pre.chroma, then skip ones inside .highlight —
            // avoids :not() complex selectors (unsupported in older Safari).
            var all = document.querySelectorAll('pre.chroma');
            for (var k = 0; k < all.length; k++) {
                if (all[k].closest('.highlight')) continue;
                all[k].style.background = 'var(--code-bg)';
                all[k].style.color = 'var(--content)';
                all[k].style.border = '1px solid var(--border)';
                all[k].style.borderRadius = 'var(--radius)';
                all[k].style.padding = '12px 16px';
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fixCodeBorders);
        } else {
            fixCodeBorders();
        }
        if (window.MutationObserver) {
            new MutationObserver(function () {
                fixCodeBorders();
                if (meta) syncThemeColor();
            }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        }

        // ===== 上下文导航 + 返回恢复（2026-08-12 v5，需求见下）=====
        // ①从标签页点进文章, 上下翻页停留在同一标签的内容里 (队列顺序)
        // ②从文章底部标签点进标签内容, 返回回到点击处(底部标签位置)
        // ③总之: 从哪里点进下一个窗口, 返回都回到上一次点击的地方
        // ④翻页不循环: 队列第一篇无「上一页」, 最后一篇无「下一页」, 到底即停;
        //   浏览器返回/前进按钮仍可在队列里来回走 (exit-pos 恢复)
        // 方案:
        //   - 点击任何站内出站链接前, 先把当前滚动位置存 sessionStorage (exit-pos:<path>)
        //   - 列表页(标签/主页)点文章时, 把当前列表全部已加载文章的有序 URL+标题
        //     存 sessionStorage (nav-ctx), 文章页据此改写 paginav 上下篇
        //   - 返回时: 有 hash = 锚点(TOC 前进); 否则优先恢复离开位置;
        //     都没有则回 TOC 目录顶部(原行为)
        // ⚠️ 沿用 scrollRestoration='manual': Safari 原生 hash 返回不恢复滚动(已知 bug)。
        try { history.scrollRestoration = 'manual'; } catch (e) {}
        var NAV_KEY = 'nav-ctx';
        var EXIT_PREFIX = 'exit-pos:';
        var tocNav = false; // 同页 TOC 锚点往返标记: 返回回目录而非离开位置

        function getExitPos() {
            try { return JSON.parse(sessionStorage.getItem(EXIT_PREFIX + location.pathname) || 'null'); }
            catch (e) { return null; }
        }
        function setExitPos() {
            try { sessionStorage.setItem(EXIT_PREFIX + location.pathname, JSON.stringify({ y: window.scrollY || 0 })); }
            catch (e) {}
        }
        function tocTopY() {
            var toc = document.querySelector('.toc');
            if (!toc) return 0;
            return Math.max(0, toc.getBoundingClientRect().top + window.scrollY - 8);
        }
        var normUrl = function (u) { return (u || '').replace(/\/+$/, ''); };

        // 点击拦截: 站内出站链接 = 记录离开位置; 列表页文章链接 = 另存导航上下文
        document.addEventListener('click', function (e) {
            if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
            var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
            if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
            var href = a.getAttribute('href');
            if (!href) return;
            try {
                // 同页 hash (TOC 锚点): 标记往返, 返回时回目录顶部
                if (href.charAt(0) === '#') {
                    tocNav = true;
                    return;
                }
                if (a.hostname !== location.hostname) return;
                setExitPos();
                tocNav = false; // 出站离开: 返回按离开位置, 不按 TOC 目录
                // 列表页/搜索页点文章: 存当前列表(标签/主页/搜索结果)的有序 URL+标题。
                // 搜索结果链接同为 .entry-link(在 li 里, 不在 article 里), 统一选择器。
                if (a.classList.contains('entry-link')) {
                    var items = [];
                    document.querySelectorAll('a.entry-link').forEach(function (el) {
                        var t = (el.getAttribute('aria-label') || '').replace(/^post link to\s*/, '');
                        if (!t) {
                            var h2 = el.closest('article') && el.closest('article').querySelector('h2');
                            if (h2) t = h2.textContent.trim();
                        }
                        items.push({ url: el.href.split('#')[0], title: t });
                    });
                    if (items.length >= 2) {
                        sessionStorage.setItem(NAV_KEY, JSON.stringify({ items: items }));
                    }
                }
            } catch (err) {}
        });

        // 文章页: 按保存的列表上下文改写上下篇链接 (同标签内容, 循环)
        function applyNavContext() {
            var nav = document.querySelector('nav.paginav');
            if (!nav) return;
            var prevA = nav.querySelector('a.prev');
            var nextA = nav.querySelector('a.next');
            if (!prevA && !nextA) return;
            var ctx = null;
            try { ctx = JSON.parse(sessionStorage.getItem(NAV_KEY) || 'null'); } catch (e) {}
            if (!ctx || !Array.isArray(ctx.items) || ctx.items.length < 2) return;
            var cur = normUrl(location.href.split('#')[0]);
            var idx = -1;
            for (var i = 0; i < ctx.items.length; i++) {
                if (normUrl(ctx.items[i].url) === cur) { idx = i; break; }
            }
            if (idx < 0) return;
            var len = ctx.items.length;
            var setLink = function (a, item) {
                a.href = item.url;
                var spans = a.querySelectorAll('span');
                if (spans.length > 1) spans[spans.length - 1].textContent = item.title;
            };
            // 队列顺序翻页, 不循环: 首篇无「上一页」, 末篇无「下一页」(与主题原生行为一致)
            if (prevA) {
                if (idx > 0) setLink(prevA, ctx.items[idx - 1]);
                else prevA.parentNode.removeChild(prevA);
            }
            if (nextA) {
                if (idx < len - 1) setLink(nextA, ctx.items[idx + 1]);
                else nextA.parentNode.removeChild(nextA);
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyNavContext);
        } else {
            applyNavContext();
        }

        // 同页 hash 变化 (TOC 锚点跳转/前进后退): 弃用旧的离开位置,
        // 返回走 TOC/锚点逻辑而非回到陈旧的 exit-pos (2026-08-12 实测补)。
        window.addEventListener('hashchange', function () {
            try { sessionStorage.removeItem(EXIT_PREFIX + location.pathname); } catch (e) {}
            tocNav = true;
        });

        // 返回/前进恢复: 有 hash = 锚点(TOC); 无 hash = 恢复离开位置(或 TOC 目录)
        function restoreBack() {
            if (location.hash) {
                // 前进: 滚到锚点标题
                var id = null;
                try { id = decodeURIComponent(location.hash.slice(1)); } catch (e2) { id = location.hash.slice(1); }
                var el = document.getElementById(id);
                if (el) {
                    var targetY = el.getBoundingClientRect().top + window.scrollY - 12;
                    scrollToSmoothly(targetY);
                    return;
                }
            }
            if (tocNav) {
                tocNav = false;
                scrollToSmoothly(tocTopY()); // TOC 锚点往返: 回目录
                return;
            }
            var exit = getExitPos();
            if (exit && typeof exit.y === 'number') {
                scrollToSmoothly(exit.y); // 出站点击的返回: 回到点击处
                return;
            }
            scrollToSmoothly(tocTopY()); // 兜底: 文章页回目录顶部
        }
        // 通用滚动恢复: 隐藏页面 → 滚动 → 落地后显示 (消除中间帧闪烁)
        function scrollToSmoothly(target) {
            var root = document.documentElement;
            var prevVis = root.style.visibility;
            root.style.visibility = 'hidden';
            var shown = false;
            function show() {
                if (shown) return;
                shown = true;
                root.style.visibility = prevVis;
            }
            var attempts = 0;
            function attempt() {
                if (attempts++ > 30) { show(); return; } // 3 秒上限, 兜底显示
                var maxY = document.documentElement.scrollHeight - window.innerHeight;
                var t = Math.max(0, Math.min(target, maxY));
                window.scrollTo(0, t);
                var landed = Math.abs(window.scrollY - t) <= 2;
                var clamped = t < target - 2; // 目标超出当前可滚高度: 图片等还在加载
                if (!landed || clamped) {
                    setTimeout(attempt, 100); // 没到位: bfcache 冻结中/内容未加载完, 等再试
                } else {
                    // 到位了: 等一帧渲染后显示, 保证用户看到的就是最终位置
                    requestAnimationFrame(show);
                    setTimeout(show, 50);
                }
            }
            attempt();
        }
        window.addEventListener('popstate', restoreBack);
        window.addEventListener('pageshow', function (e) {
            // bfcache 恢复 或 back_forward 重载: 都走 restoreBack 恢复位置。
            // 用 navigation type 区分「返回到达」与「正常刷新/新开」。
            var navType = '';
            try { navType = (performance.getEntriesByType('navigation')[0] || {}).type || ''; } catch (e3) {}
            if (e.persisted || navType === 'back_forward') restoreBack();
        });

        // ===== 跳到底部按钮（2026-08-12）=====
        // 照主题「回到顶部」top-link 的对称逻辑: 距底部超过一屏时显示, 到底隐藏。
        // 用 <button> 而非 <a href="#...">: 锚点会改 URL hash, 触发上面的
        // hashchange 处理(弃用 exit-pos + tocNav 标记), 污染返回恢复逻辑。
        function initBottomLink() {
            var btn = document.createElement('button');
            btn.id = 'bottom-link';
            btn.className = 'bottom-link hidden';
            btn.setAttribute('aria-label', '跳到底部');
            btn.title = '跳到底部';
            btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="7 13 12 18 17 13"></polyline><polyline points="7 6 12 11 17 6"></polyline></svg>';
            document.body.appendChild(btn);
            function update() {
                var docH = document.documentElement.scrollHeight || document.body.scrollHeight;
                var dist = docH - (window.innerHeight + (window.scrollY || 0));
                btn.classList.toggle('hidden', dist < window.innerHeight);
                // 2026-08-12: bottom-link 动态定位到 top-link 下方 16px
                // (实测跟随渲染位置, 适配任何视口/字号; CSS bottom 仅作 fallback)
                var t = document.getElementById('top-link');
                if (t) {
                    var tr = t.getBoundingClientRect();
                    if (tr.height > 0) {
                        btn.style.bottom = (window.innerHeight - tr.bottom + 16) + 'px';
                    } else {
                        btn.style.bottom = '';
                    }
                }
            }
            btn.addEventListener('click', function () {
                var docH = document.documentElement.scrollHeight || document.body.scrollHeight;
                try { window.scrollTo({ top: docH, behavior: 'smooth' }); }
                catch (e2) { window.scrollTo(0, docH); }
            });
            window.addEventListener('scroll', update, { passive: true });
            window.addEventListener('resize', update, { passive: true });
            update();
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initBottomLink);
        } else {
            initBottomLink();
        }
    })();

    // 2026-08-12: Service Worker 注册 — 静态资源缓存, 二次访问秒开。
    // 只注册不预取; GitHub Pages 支持 SW (HTTPS)。
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
        navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.warn('SW 注册失败:', err);
        });
    }
</script>
