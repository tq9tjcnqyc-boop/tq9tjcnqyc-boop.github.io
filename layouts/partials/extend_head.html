<script>
    (function () {
        // 图片立即加载: Hugo 默认 loading=lazy, 专利附图是内容核心,
        // 懒加载导致手机快速翻页时图片空白/未定位(用户反馈"显示不全/不居中")。
        // 全部改为 eager, 打开页面即全部加载。
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('.post-content img').forEach(function (im) {
                    im.loading = 'eager';
                });
            });
        } else {
            document.querySelectorAll('.post-content img').forEach(function (im) {
                im.loading = 'eager';
            });
        }
        // 自动刷新检测: GitHub Pages CDN 缓存 HTML 10 分钟, 部署后刷新可能
        // 拿到旧版。用构建时间戳做版本号, localStorage 比对, 版本变了自动 reload。
        // ⚠️ 必须限制为「每会话最多 reload 一次」: CDN 缓存抖动时 reload 后
        // 版本号可能又不同, 不限制会无限 reload 转圈(2026-08-10 实测踩坑)。
        var VER_KEY = 'site-ver';
        var RELOAD_KEY = 'site-reloaded-now';
        var THIS_VER = {{ now.Unix }};
        try {
            var old = localStorage.getItem(VER_KEY);
            var reloaded = sessionStorage.getItem(RELOAD_KEY);
            if (old && old !== String(THIS_VER) && !reloaded) {
                localStorage.setItem(VER_KEY, String(THIS_VER));
                sessionStorage.setItem(RELOAD_KEY, '1');
                location.reload();
            } else if (!old) {
                localStorage.setItem(VER_KEY, String(THIS_VER));
            }
        } catch (e) {}

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
            // PaperMod theme colors: light = white (home bg), dark = rgb(29,30,32)
            function syncThemeColor() {
                var theme = document.documentElement.dataset.theme;
                meta.content = (theme === 'dark') ? '#1d1e20' : '#ffffff';
            }
            syncThemeColor();
            // keep in sync when user toggles theme (data-theme attr changes)
            if (window.MutationObserver) {
                new MutationObserver(syncThemeColor).observe(
                    document.documentElement,
                    { attributes: true, attributeFilter: ['data-theme'] }
                );
            }
        }
        // Hard guarantee: in light mode the code block must render as a SINGLE
        // rounded outer frame. Inline styles beat any stylesheet (incl. stale
        // cached CSS): zero inner borders AND inner background (inner pre has
        // no border-radius; its bg would poke square corners out of the arc).
        function fixCodeBorders() {
            if (document.documentElement.dataset.theme === 'dark') return;
            var blocks = document.querySelectorAll('.highlight');
            for (var i = 0; i < blocks.length; i++) {
                var h = blocks[i];
                h.style.border = '1px solid var(--border)';
                h.style.borderRadius = 'var(--radius)';
                var inners = h.querySelectorAll('pre, code, .chroma');
                for (var j = 0; j < inners.length; j++) {
                    inners[j].style.border = 'none';
                    inners[j].style.outline = 'none';
                    inners[j].style.boxShadow = 'none';
                    inners[j].style.background = 'transparent';
                    inners[j].style.borderRadius = 'var(--radius)';
                }
            }
            // Bare <pre class="chroma"> (no .highlight wrapper): PaperMod's
            // chroma theme is DARK, so in light mode give it a light card.
            // NOTE: query all pre.chroma, then skip ones inside .highlight —
            // avoids :not() complex selectors (unsupported in older Safari).
            var all = document.querySelectorAll('pre.chroma');
            for (var k = 0; k < all.length; k++) {
                if (all[k].closest('.highlight')) continue;
                all[k].style.background = 'var(--code-bg)';
                all[k].style.color = 'var(--content)';
                all[k].style.border = '1px solid var(--border)';
                all[k].style.borderRadius = 'var(--radius)';
                all[k].style.padding = '12px 16px';
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fixCodeBorders);
        } else {
            fixCodeBorders();
        }
        if (window.MutationObserver) {
            new MutationObserver(function () {
                fixCodeBorders();
                if (meta) syncThemeColor();
            }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        }

        // TOC 返回恢复（2026-08-11 第三版，针对 iOS Safari）:
        // Safari 原生 hash 返回不恢复滚动位置(已知 bug), 必须 JS 接管。
        // 但 popstate 里一次 scrollTo 会输给 bfcache 冻结(页面恢复时暂停,
        // JS 排队到用户触摸才跑, 且原生恢复会覆盖)。所以:
        // 1) scrollRestoration='manual' — 告诉浏览器别管滚动, 我们接管
        // 2) 点击目录时记录当前位置(不 preventDefault, hash 导航正常)
        // 3) 返回时轮询 scrollTo 直到到位 — 冻结解除后 setTimeout 自然继续
        try { history.scrollRestoration = 'manual'; } catch (e) {}
        var TOC_KEY = 'toc-return-y';
        document.addEventListener('click', function (e) {
            var a = e.target.closest ? e.target.closest('.toc a[href^="#"]') : null;
            if (!a) return;
            // 记录「回到目录」的滚动位置: TOC 容器在文章开头, 取它的
            // 文档绝对位置(rect.top + scrollY)。不用 window.scrollY——
            // 点击瞬间原生锚点跳转可能已抢先滚动, 记录到的是标题位置。
            var toc = document.querySelector('.toc');
            var y = toc ? toc.getBoundingClientRect().top + window.scrollY : 0;
            try { sessionStorage.setItem(TOC_KEY, String(Math.max(0, y - 8))); } catch (err) {}
        });
        function restoreToc() {
            // 前进方向: URL 有 hash → 滚到对应锚点标题
            // (scrollRestoration=manual 后浏览器不恢复, 必须自己滚)
            if (location.hash) {
                var id = null;
                try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) { id = location.hash.slice(1); }
                var el = document.getElementById(id);
                if (el) {
                    var targetY = el.getBoundingClientRect().top + window.scrollY - 12;
                    scrollToSmoothly(targetY);
                    return;
                }
            }
            // 返回方向: 无 hash → 恢复目录位置
            var y = null;
            try { y = parseInt(sessionStorage.getItem(TOC_KEY), 10); } catch (e) {}
            if (y === null || isNaN(y)) return;
            try { sessionStorage.removeItem(TOC_KEY); } catch (e) {}
            scrollToSmoothly(y);
        }
        // 通用滚动恢复: 隐藏页面 → 滚动 → 落地后显示 (消除中间帧闪烁)
        function scrollToSmoothly(target) {
            var root = document.documentElement;
            var prevVis = root.style.visibility;
            root.style.visibility = 'hidden';
            var shown = false;
            function show() {
                if (shown) return;
                shown = true;
                root.style.visibility = prevVis;
            }
            var attempts = 0;
            function attempt() {
                if (attempts++ > 30) { show(); return; } // 3 秒上限, 兜底显示
                var maxY = document.documentElement.scrollHeight - window.innerHeight;
                var t = Math.max(0, Math.min(target, maxY));
                window.scrollTo(0, t);
                if (Math.abs(window.scrollY - t) > 2) {
                    setTimeout(attempt, 100); // 没到位: bfcache 冻结中, 等解冻再试
                } else {
                    // 到位了: 等一帧渲染后显示, 保证用户看到的就是最终位置
                    requestAnimationFrame(show);
                    setTimeout(show, 50);
                }
            }
            attempt();
        }
        window.addEventListener('popstate', restoreToc);
        window.addEventListener('pageshow', function (e) {
            if (e.persisted) restoreToc(); // bfcache 恢复
        });
    })();
</script>
