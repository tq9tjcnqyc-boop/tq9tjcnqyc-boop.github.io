{{ define "main" }}
<!-- Pagefind 核心库 preload (静态搜索框: 搜索框 HTML 直接渲染, 零 JS 依赖) -->
<link rel="preload" href="/pagefind/pagefind.js" as="script">
<link rel="preload" href="/pagefind/pagefind-ui.css" as="style">
<link rel="preload" href="/pagefind/wasm.unknown.pagefind" as="fetch" crossorigin>
<link rel="preload" href="/pagefind/pagefind-entry.json" as="fetch" crossorigin>
<div class="page-search">
    <header class="page-header">
        <h1>搜索</h1>
    </header>
    <!-- 静态搜索框: HTML 直接渲染, 不等任何 JS。输入时才动态加载 pagefind -->
    <div class="pagefind-ui" data-pagefind-ui>
        <div class="pagefind-ui__search-input-wrap">
            <input id="search-input" class="pagefind-ui__search-input" type="search"
                   placeholder="输入关键词搜索…" autocomplete="off" autocorrect="off" spellcheck="false">
            <button id="search-btn" class="pagefind-ui__search-btn" type="button">搜索</button>
        </div>
        <div id="search-meta" class="pagefind-ui__message" hidden></div>
        <div id="search-results" class="pagefind-ui__results"></div>
    </div>
</div>
<script>
(function () {
    // --- 已访问链接记忆 (内存) --- (沿用原逻辑)
    var visitedList = [];
    function isVisited(url) { return visitedList.indexOf(url) !== -1; }
    function markVisited(url) { if (!url || isVisited(url)) return; visitedList.push(url); }
    function paintVisited() {
        if (!visitedList.length) return;
        document.querySelectorAll('.search-result-title a').forEach(function (a) {
            if (isVisited(a.href)) a.classList.add('visited');
        });
    }
    document.addEventListener('click', function (e) {
        var a = e.target.closest ? e.target.closest('.search-result-title a') : null;
        if (a) { markVisited(a.href); a.classList.add('visited'); }
    }, true);
    window.addEventListener('pageshow', paintVisited);
    document.addEventListener('visibilitychange', function () {
        if (!document.hidden) paintVisited();
    });

    var input = document.getElementById('search-input');
    var resultsEl = document.getElementById('search-results');
    var metaEl = document.getElementById('search-meta');
    var pagefindPromise = null;  // 懒加载 pagefind 核心 (首次输入才初始化)

    function getPagefind() {
        if (!pagefindPromise) {
            pagefindPromise = import('/pagefind/pagefind.js').then(function (pf) {
                // 2026-08-11: 摘要加长到 120 词, 配合 CSS line-clamp 超2行省略号
                return pf.options({ excerptLength: 120 }).then(function () { return pf; });
            });
        }
        return pagefindPromise;
    }

    // 2026-08-11 预热: 页面加载后立即初始化 Pagefind (不等用户点击),
    // 首次搜索时索引/wasm 已就绪, 省掉 1-3s 初始化等待
    function prewarm() {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () {
                getPagefind().catch(function () {});
            });
        } else {
            getPagefind().catch(function () {});
        }
        // 页面空闲时再预取全部 fragment (840KB), 触发浏览器 HTTP 缓存
        // 之后 data() 全命中缓存, 滚动加载秒出
        if ('requestIdleCallback' in window) {
            window.requestIdleCallback(function () { prefetchFragments(); }, { timeout: 3000 });
        } else {
            setTimeout(prefetchFragments, 1500);
        }
    }
    // 预取全部 fragment 到浏览器 HTTP 缓存 (后台并行, 不阻塞)
    // 构建时 gen_fragments.sh 生成 /pagefind/fragments.json (全部文件名)
    function prefetchFragments() {
        if (window.__fragPrefetched) return;
        window.__fragPrefetched = true;
        fetch('/pagefind/fragments.json').then(function (r) { return r.json(); }).then(function (files) {
            if (!files || !files.length) return;
            var idx = 0;
            var CONC = 20;  // 并发预取数 (避免一次性打爆连接)
            function next() {
                while (idx < files.length && CONC > 0) {
                    var n = idx++;
                    CONC--;
                    fetch('/pagefind/' + files[n], { cache: 'force-cache' })
                        .then(function () { CONC++; next(); })
                        .catch(function () { CONC++; next(); });
                }
            }
            next();
        }).catch(function () {});
    }
    prewarm();

    // 数字查询自定义摘要: 从正文定位独立数字(如 "1、"), 截取上下文, 高亮该数字本身
    // (Pagefind 对数字前缀匹配, excerpt 会高亮 101/106 这种, 用户要求高亮独立数字)
    function buildNumExcerpt(d, q) {
        var raw = d.raw_content || d.content || '';
        if (!raw) return '';
        var re = new RegExp('(^|[^0-9])(' + q + ')([^0-9]|$)');
        var m = re.exec(raw);
        if (!m) return '';
        var start = Math.max(0, m.index - 15);
        var end = Math.min(raw.length, m.index + m[0].length + 35);
        var seg = raw.slice(start, end);
        // 转义 HTML 后重新插入高亮 mark
        seg = seg.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        var re2 = new RegExp('([^0-9])(' + q + ')([^0-9]|$)');
        seg = seg.replace(re2, '$1<mark>' + q + '</mark>$3');
        return (start > 0 ? '…' : '') + seg + (end < raw.length ? '…' : '');
    }

    // 渲染一条结果 (pagefind 原始格式)
    function renderResult(r) {
        var el = document.createElement('article');
        el.className = 'pagefind-ui__result';
        // 标题在 meta.title (Pagefind data() 无顶层 title 字段)
        var title = ((r.meta && r.meta.title) || r.title || '无标题').replace(/#+\s*$/, '').trim();
        var granted = r.filters && r.filters.granted && r.filters.granted.length > 0;
        var rejected = r.filters && r.filters.rejected && r.filters.rejected.length > 0;
        var tEl = document.createElement('h3');
        tEl.className = 'pagefind-ui__result-title search-result-title';
        var a = document.createElement('a');
        a.href = r.url;
        a.innerHTML = (granted ? '✅ ' : (rejected ? '❌ ' : '')) + title;
        tEl.appendChild(a);
        // 摘要
        var eEl = document.createElement('p');
        eEl.className = 'pagefind-ui__result-excerpt';
        // 摘要 (2026-08-11 统一: 优先用 Pagefind 原生摘要, 数字查询的
        // 原生摘要若不含独立数字(如只高亮 106/101), 才 fallback 自定义定位)
        var excerptHtml = r.excerpt || '';
        if (window.__qIsNum) {
            // Pagefind 对数字前缀匹配, 原生 excerpt 可能只高亮 106/101 这种;
            // 检查摘要里是否有独立数字(前后非数字), 没有才用自定义定位
            var hasStandalone = new RegExp('(^|[^0-9])' + window.__q + '([^0-9]|$)').test(
                excerptHtml.replace(/<[^>]+>/g, '')
            );
            if (!hasStandalone) {
                excerptHtml = buildNumExcerpt(r, window.__q);
            }
        }
        eEl.innerHTML = excerptHtml;
        el.appendChild(tEl);
        el.appendChild(eEl);
        if (isVisited(a.href)) a.classList.add('visited');
        return el;
    }

    var timer = null;
    var BATCH = 12;  // 渐进渲染批大小: 首批快出, 后续后台补全 (不砍结果数)
    var searchBtn = document.getElementById('search-btn');
    var rendered = [];  // 已渲染 doc 数组 (保持有序) — 提升到外层供点击导航读取 (2026-08-11)
    var searchToken = 0;  // 每次搜索递增, 丢弃过期异步结果 (2026-08-11 修复双 end bug)
    // loader / end 单例: 只创建一次, 搜索时切换显隐 (2026-08-11 修复快速连点双 end)
    var loader = document.createElement('div');
    loader.className = 'isf-loader';
    loader.innerHTML = '<span class="isf-spinner"></span><span>加载中…</span>';
    var endMark = document.createElement('div');
    endMark.className = 'isf-end';
    endMark.textContent = '— 已加载全部结果 —';
    resultsEl.parentNode.appendChild(loader);
    resultsEl.parentNode.appendChild(endMark);
    function doSearch() {
        var q = input.value.trim();
        clearTimeout(timer);
        rendered = [];  // 新搜索重置
        var myToken = ++searchToken;  // 本次搜索的 token
        // 重置 loader/end 状态 (单例复用, 不重复创建)
        loader.classList.remove('visible');
        endMark.classList.remove('visible');
        if (!q) {
            resultsEl.innerHTML = '';
            metaEl.hidden = true;
            return;
        }
        // 立即清空旧结果 + 显示加载中 (点击按钮才搜索, 结果立刻开始渲染)
        resultsEl.innerHTML = '';
        // 搜索开始即预取全部 fragment (加速后续滚动加载)
        prefetchFragments();
        // 移除旧搜索的 scroll 监听 (2026-08-11)
        if (window.__searchOnScroll) {
            window.removeEventListener('scroll', window.__searchOnScroll);
            window.__searchOnScroll = null;
        }
        metaEl.textContent = '搜索「' + q + '」中…';
        metaEl.hidden = false;
        getPagefind().then(function (pagefind) {
            // 三次轻量并行搜索 (索引内操作, 无需 data()):
            // 1) 全部  2) 授权  3) 驳回 — 零成本拿到状态分组
            return Promise.all([
                pagefind.search(q, { excerptLength: 120 }),
                pagefind.search(q, { filters: { granted: 'true' }, excerptLength: 120 }),
                pagefind.search(q, { filters: { rejected: 'true' }, excerptLength: 120 })
            ]);
        }).then(function (res3) {
            if (myToken !== searchToken) return;  // 过期搜索, 丢弃 (2026-08-11)
            var all = (res3[0] && res3[0].results) || [];
            var grantedRes = (res3[1] && res3[1].results) || [];
            var rejectedRes = (res3[2] && res3[2].results) || [];
            if (!all.length) {
                metaEl.textContent = '没有找到「' + q + '」相关的内容';
                metaEl.hidden = false;
                return;
            }
                metaEl.textContent = '搜索「' + q + '」共 ' + all.length + ' 条结果';
                metaEl.hidden = false;
                // 状态集合 (id → 2=授权 1=驳回 0=普通)
                var grantedIds = {};
                var rejectedIds = {};
                grantedRes.forEach(function (r) { grantedIds[r.id] = 1; });
                rejectedRes.forEach(function (r) { rejectedIds[r.id] = 1; });
                // 排序: 标题含完整查询词优先 → 授权 > 驳回 > 普通 (组内保持 Pagefind 相关性)
                // 状态零成本 (三次搜索), 标题匹配在 data() 到达时渐进判断
                var list = all.slice();
                list.sort(function (a, b) {
                    var sa = grantedIds[a.id] ? 2 : (rejectedIds[a.id] ? 1 : 0);
                    var sb = grantedIds[b.id] ? 2 : (rejectedIds[b.id] ? 1 : 0);
                    if (sa !== sb) return sb - sa;
                    return 0;  // 组内保持 Pagefind 顺序
                });
                // 全字匹配判断 (2026-08-11): 纯数字查询必须独立匹配
                //   「1」只匹配独立 1 (如 "1、一种"), 不匹配 106/101 里的 1
                //   非数字查询: 标题或摘要完整包含查询词
                var qIsNum = /^\d+$/.test(q);
                window.__qIsNum = qIsNum;
                window.__q = q;
                var numRe = qIsNum ? new RegExp('(^|[^0-9])' + q + '([^0-9]|$)') : null;
                function isExactText(text) {
                    if (!text) return false;
                    if (numRe) return numRe.test(text);
                    return text.indexOf(q) > -1;
                }
                function sortKey(d) {
                    var t = (d.meta && d.meta.title) || '';
                    var e = d.excerpt || '';
                    var c = d.raw_content || d.content || '';
                    var exact = (isExactText(t) || isExactText(e) || isExactText(c)) ? 1 : 0;
                    var st = grantedIds[d.id] ? 2 : (rejectedIds[d.id] ? 1 : 0);
                    return { exact: exact, st: st };
                }
                function keyCmp(a, b) {
                    if (a.exact !== b.exact) return b.exact - a.exact;
                    return b.st - a.st;
                }
                function insertDoc(doc) {
                    var el = renderResult(doc);
                    var k = sortKey(doc);
                    var i = 0;
                    while (i < rendered.length && keyCmp(k, sortKey(rendered[i])) <= 0) i++;
                    rendered.splice(i, 0, doc);
                    if (i < resultsEl.children.length) {
                        resultsEl.insertBefore(el, resultsEl.children[i]);
                    } else {
                        resultsEl.appendChild(el);
                    }
                }
                // 渐进渲染: 首批 BATCH 条并行取 data() 快出, 其余滚动到底再加载 (2026-08-11)
                // (全字匹配优先排序, 不过滤; 无限滚动: 和首页 isf-loader 一致)
                // 2026-08-11: 全字匹配改为「排序优先」— 所有结果都显示,
                // 标题/摘要完整包含查询词的排最前, 其余按状态+相关性排后面
                var idx = 0;
                var loading = false;
                var allDone = false;
                function renderNextBatch() {
                    if (loading || allDone) return;
                    var batch = list.slice(idx, idx + BATCH);
                    if (!batch.length) {
                        allDone = true;
                        loader.classList.remove('visible');
                        endMark.classList.add('visible');
                        return;  // meta 数字保持初始值, 不跳变 (2026-08-11)
                    }
                    loading = true;
                    loader.classList.add('visible');
                    idx += BATCH;
                    Promise.all(batch.map(function (r) { return r.data(); })).then(function (docs) {
                        if (myToken !== searchToken) return;  // 过期搜索, 丢弃 (2026-08-11)
                        docs.forEach(insertDoc);  // 全部渲染, 不过滤 (2026-08-11)
                        loader.classList.remove('visible');
                        loading = false;
                        // 内容不足一屏时自动继续加载, 否则等滚动触发 (2026-08-11)
                        if (document.body.scrollHeight <= window.innerHeight * 1.2) {
                            renderNextBatch();
                        }
                    });
                }
                // 滚动到底部触发下一批 (2026-08-11 无限滚动, 与首页一致)
                window.__searchOnScroll = function () {
                    if (loading || allDone) return;
                    var w = window;
                    if (w.innerHeight + w.scrollY >= document.body.scrollHeight - 300) {
                        renderNextBatch();
                    }
                };
                window.addEventListener('scroll', window.__searchOnScroll);
                renderNextBatch();
            }).catch(function () {
                metaEl.textContent = '搜索加载失败，请重试';
                metaEl.hidden = false;
            });
    }
    // 点击「搜索」按钮 或 回车 → 触发搜索 (2026-08-11: 不再输入即搜)
    searchBtn.addEventListener('click', doSearch);
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { doSearch(); }
    });
    // 搜索结果导航 (2026-08-11): 点击结果时把结果顺序+标题存 sessionStorage,
    // 文章页用它改写上一篇/下一篇为上一结果/下一结果
    resultsEl.addEventListener('click', function (e) {
        var a = e.target.closest ? e.target.closest('a') : null;
        if (!a || !a.href) return;
        var urls = rendered.map(function (d) {
            return {
                url: new URL(d.url, location.origin).pathname,
                title: (d.meta && d.meta.title) || ''
            };
        });
        try {
            sessionStorage.setItem('searchNav', JSON.stringify(urls));
        } catch (err) { /* 忽略存储失败 */ }
    });
})();
</script>
{{ end }}
