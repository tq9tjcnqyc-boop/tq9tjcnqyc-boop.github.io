{{ define "main" }}
<div class="page-search">
    <header class="page-header">
        <h1>搜索</h1>
    </header>
    <div id="search"></div>
</div>
<script>
    window.addEventListener('DOMContentLoaded', function () {
        if (!window.PagefindUI) return;

        // --- 已访问链接记忆 (localStorage) ---
        // :visited 伪类在手机浏览器/内置浏览器里经常失效, 用 JS 记录点击过的
        // 结果 URL, 渲染时直接给这些链接加 visited 类标紫, 100% 可控。
        var VISITED_KEY = 'pagefind-visited-v1';
        function getVisited() {
            try { return JSON.parse(localStorage.getItem(VISITED_KEY) || '[]'); }
            catch (e) { return []; }
        }
        function markVisited(url) {
            if (!url) return;
            var list = getVisited();
            if (list.indexOf(url) === -1) {
                list.push(url);
                try { localStorage.setItem(VISITED_KEY, JSON.stringify(list)); } catch (e) {}
            }
        }
        function paintVisited() {
            var visited = getVisited();
            if (!visited.length) return;
            document.querySelectorAll('.pagefind-ui__result-title a').forEach(function (a) {
                if (visited.indexOf(a.href) !== -1) {
                    a.classList.add('visited');
                }
            });
        }
        // 点击结果链接时: 写入 localStorage + 立即给 DOM 加 visited 类。
        // 立即标灰很关键——手机浏览器按返回时走 bfcache(后退缓存), 恢复的
        // 是离开时的 DOM 快照且不重新执行 JS; 点击瞬间类已加上, 快照里就有。
        document.addEventListener('click', function (e) {
            var a = e.target.closest ? e.target.closest('.pagefind-ui__result-title a') : null;
            if (a) {
                markVisited(a.href);
                a.classList.add('visited');
            }
        }, true);

        // bfcache 恢复/切回标签页时兜底重刷 (localStorage 里已有的链接)
        function refreshVisited() {
            paintVisited();
        }
        window.addEventListener('pageshow', refreshVisited);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) refreshVisited();
        });

        var ui = new PagefindUI({
            element: '#search',
            showSubResults: false,
            showImages: false,
            pageSize: 20,
            processResult: function (result) {
                // Strip anchor "…#" artifacts from titles extracted from the H1
                if (result.title) {
                    result.title = result.title.replace(/#+\s*$/, '').trim();
                }
                return result;
            },
            translations: {
                placeholder: '输入关键词搜索…',
                zero_results: '没有找到 [SEARCH_TERM] 相关的内容',
                search_after: '搜索 [SEARCH_TERM] 的结果',
                search_after_no_results: '搜索 [SEARCH_TERM] 没有结果',
                loading: '加载中…',
            }
        });

        // 结果渲染是异步的: 用 MutationObserver 在结果出现后标紫已访问链接
        var target = document.querySelector('#search');
        var observer = new MutationObserver(function () {
            paintVisited();
        });
        observer.observe(target, { childList: true, subtree: true });
    });
</script>
<script src="/pagefind/pagefind-ui.js"></script>
{{ end }}
