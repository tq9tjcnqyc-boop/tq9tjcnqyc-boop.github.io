<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if section.title and section.title != config.title %}{{ section.title }} · {% endif %}{{ config.title }}</title>
  <meta name="description" content="{{ config.description }}">
  <style>
    :root {
      --ink: #1a1a1a;
      --paper: #fdfdfc;
      --muted: #8a8a85;
      --hairline: #e5e5e1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Songti SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif;
      font-size: 17px;
      line-height: 1.9;
      padding: 0 24px;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 96px 0 120px;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      margin-bottom: 1.2rem;
    }
    h2 {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      margin: 3rem 0 1rem;
    }
    p { margin-bottom: 1.1rem; color: #3a3a36; }
    ul { list-style: none; }
    li { margin-bottom: 0.9rem; }
    a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 1px;
      transition: border-color .2s ease;
    }
    a:hover { border-color: var(--ink); }
    .lead { color: var(--muted); font-size: 1rem; margin-bottom: 2.5rem; }
    hr {
      border: none;
      border-top: 1px solid var(--hairline);
      margin: 3rem 0;
    }
    footer {
      margin-top: 5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    @media (max-width: 600px) {
      main { padding: 56px 0 80px; }
      h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <main>
    {{ section.content | safe }}
    <footer>{{ config.extra.author }} · {{ now() | date(format="%Y") }}</footer>
  </main>
</body>
</html>
