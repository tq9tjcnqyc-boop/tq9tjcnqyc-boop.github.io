baseURL = 'https://tq9tjcnqyc-boop.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = '专利档案库'
theme = 'PaperMod'
enableInlineShortcodes = true
enableRobotsTXT = true
paginate = 5

# 顶层键必须放在所有 [表头] 之前! (TOML 表之后的键会被归入该表)
cleanDestinationDir = true
buildFuture = true
# 2026-08-12: 去掉标签功能(搜索只搜标题, 标签功能+标签全删)
# 空 [taxonomies] 必须显式声明, 删掉会恢复 Hugo 默认 tag/category
# 官方文档 kind 名: taxonomy / term
disableKinds = ['taxonomy', 'term']

[pagination]
  pagerSize = 5

# 2026-08-11: 主题自带搜索需要 index.json (Fuse.js 数据源)
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params]
  env = 'production'
  mainSections = ['posts']
  defaultTheme = 'auto'
  disableSpecial1stPost = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = false
  ShowToc = true
  hideFooter = false

[[menu.main]]
  name = '搜索'
  url = '/search/'
  weight = 10

[[menu.main]]
  name = '关于'
  url = '/about/'
  weight = 20

