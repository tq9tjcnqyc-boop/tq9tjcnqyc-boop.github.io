baseURL = 'https://tq9tjcnqyc-boop.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = '专利档案库'
theme = 'PaperMod'
enableInlineShortcodes = true
enableRobotsTXT = true
paginate = 9

[pagination]
  pagerSize = 9

cleanDestinationDir = true
disableKinds = ['taxonomy', 'term']
# 构建含「未来」文章: slug 时间戳可能晚于当前时刻, 默认 buildFuture=false
# 会把它们当未来文章跳过(2026-08-10 实测 100 篇只剩 8 篇)。开启后全量构建。
buildFuture = true

[params]
  env = 'production'
  mainSections = ['posts']
  defaultTheme = 'auto'
  disableSpecial1stPost = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = false
  ShowToc = true
  hideFooter = false

[[menu.main]]
  name = '搜索'
  url = '/search/'
  weight = 10

[[menu.main]]
  name = '关于'
  url = '/about/'
  weight = 20

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/tq9tjcnqyc-boop'

[params.assets]
  theme_color = '#ffffff'

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  codefences = true
  noclasses = false
  style = 'catppuccin-latte'
  tabwidth = 4
  wrapperclass = 'highlight'
