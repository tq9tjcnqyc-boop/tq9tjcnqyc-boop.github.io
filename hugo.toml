baseURL = 'https://tq9tjcnqyc-boop.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = '专利档案库'
theme = 'PaperMod'
enableInlineShortcodes = true
enableRobotsTXT = true
paginate = 5

[pagination]
  pagerSize = 5

cleanDestinationDir = true
# 2026-08-11: 启用标签功能 (原来禁用 taxonomy, 现在用标签页替代搜索)
disableKinds = []
buildFuture = true

[taxonomies]
  tag = 'tags'

# 2026-08-11: 主题自带搜索需要 index.json (Fuse.js 数据源)
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params]
  env = 'production'
  mainSections = ['posts']
  defaultTheme = 'auto'
  disableSpecial1stPost = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = false
  ShowToc = true
  hideFooter = false

[[menu.main]]
  name = '搜索'
  url = '/search/'
  weight = 10

[[menu.main]]
  name = '标签'
  url = '/tags/'
  weight = 20

[[menu.main]]
  name = '关于'
  url = '/about/'
  weight = 30

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/tq9tjcnqyc-boop'

[params.assets]
  theme_color = '#ffffff'

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  codefences = true
  noclasses = false
  style = 'catppuccin-latte'
  tabwidth = 4
  wrapperclass = 'highlight'
