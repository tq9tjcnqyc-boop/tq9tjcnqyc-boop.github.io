baseURL = 'https://tq9tjcnqyc-boop.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = '壹句'
theme = 'PaperMod'
enableInlineShortcodes = true
enableRobotsTXT = true
paginate = 5
cleanDestinationDir = true
disableKinds = ['taxonomy', 'term']

[params]
  env = 'production'
  mainSections = ['posts']
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true
  hideFooter = false

[[menu.main]]
  name = '文章'
  url = '/posts/'
  weight = 10

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/tq9tjcnqyc-boop'

[params.assets]
  theme_color = '#f5f5f5'

[markup.goldmark.renderer]
  unsafe = true
